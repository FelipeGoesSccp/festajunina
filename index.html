<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festa Junina de Brasileirinhos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Barlow:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #eeb44f; font-family: 'Barlow', sans-serif; color: #4e342e; }
        .font-festiva { font-family: 'Fredoka One', cursive; }

        .input-pill {
            width: 100%;
            background-color: #d9a441;
            border: none;
            border-radius: 9999px;
            padding: 0.8rem 1.5rem;
            color: white;
            outline: none;
        }
        .input-pill::placeholder { color: rgba(255, 255, 255, 0.7); }

        .btn-junino {
            width: 100%;
            padding: 1.2rem;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.2rem;
            text-transform: uppercase;
            color: white;
            border: none;
            border-bottom: 4px solid rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-junino:active { transform: scale(0.95); border-bottom-width: 2px; }
    </style>
</head>
<body>

    <div id="screen-home" class="max-w-md mx-auto p-6 flex flex-col items-center">
        <div class="w-full flex justify-around mb-10 text-2xl opacity-80">🚩 🏁 🚩 🏁</div>
        <h1 class="font-festiva text-white text-4xl text-center mb-1 drop-shadow-md">Festa Junina</h1>
        <p class="text-white text-[10px] font-black tracking-[0.3em] uppercase mb-12">de brasileirinhos</p>
        
        <div class="w-full space-y-4 px-2">
            <button onclick="loadProducts('Comida', '#3b82f6')" class="btn-junino" style="background-color: #3b82f6;">🍽️ Comida</button>
            <button onclick="loadProducts('Bebidas', '#facc15')" class="btn-junino" style="background-color: #facc15; color: #4e342e;">🥤 Bebidas</button>
            <button onclick="loadProducts('Promoções', '#ef4444')" class="btn-junino" style="background-color: #ef4444;">🏷️ Promoções</button>
            <button onclick="loadProducts('Especial', '#22c55e')" class="btn-junino" style="background-color: #22c55e;">⭐ Especial da Festa</button>
        </div>
    </div>

    <div id="screen-products" class="hidden max-w-md mx-auto p-4">
        <div class="flex items-center mb-8 pt-5 px-2">
            <button onclick="showScreen('home')" class="text-white text-3xl">↩</button>
            <h2 id="category-title" class="font-festiva text-white text-3xl text-center flex-1 pr-8">Produtos</h2>
        </div>
        <div id="products-grid" class="space-y-6 px-2"></div>
    </div>

    <div id="screen-checkout" class="hidden max-w-md mx-auto p-6">
        <button onclick="showScreen('home')" class="text-white text-3xl mb-8">↩</button>
        <h2 class="font-festiva text-white text-4xl text-center mb-10">PAGAMENTO</h2>
        <div class="space-y-5">
            <div>
                <label class="text-[10px] font-bold uppercase ml-4">Nome Completo</label>
                <input type="text" class="input-pill" placeholder="Robertinho Costa">
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase ml-4">CPF</label>
                <input type="text" class="input-pill" placeholder="000.000.000-00">
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase ml-4">Número do Cartão</label>
                <input type="text" class="input-pill" placeholder="0000 0000 0000 0000">
            </div>
            <div class="bg-[#d9a441] rounded-[20px] p-4 flex justify-between items-center text-white mt-10">
                <span class="font-bold text-xs uppercase">Forma de Pagamento</span>
                <span class="font-bold">Crédito ▼</span>
            </div>
            <button onclick="showScreen('success')" class="w-full border-2 border-white text-white font-black py-4 rounded-full mt-10 uppercase tracking-widest">Fechar Pedido</button>
        </div>
    </div>

    <div id="screen-success" class="hidden max-w-md mx-auto p-6 text-center pt-24 text-white">
        <div class="w-full flex justify-around mb-10 text-2xl opacity-80">🚩 🏁 🚩 🏁</div>
        <h2 class="font-festiva text-4xl mb-6">Compra efetuada!</h2>
        <p class="text-lg mb-20 px-10">Muito obrigado pela sua preferência e compra!</p>
        <p class="font-festiva text-2xl mb-20 uppercase">Volte sempre</p>
        <button onclick="showScreen('home')" class="bg-white text-[#eeb44f] font-black px-12 py-4 rounded-full shadow-xl">NOVO PEDIDO</button>
    </div>

    <script>
        const fakeProducts = {
            'Comida': [
                {
                    nome: 'Baião de Dois',
                    preco: '25,00',
                    img: 'https://www.yoki.com.br/_next/image?url=https%3A%2F%2Fprodcontent.yoki.com.br%2Fwp-content%2Fuploads%2F2024%2F09%2FBaiao-de-dois-800x450-1.jpg&w=1400&q=75'
                },
                {
                    nome: 'Feijão Tropeiro',
                    preco: '22,00',
                    img: 'https://www.yoki.com.br/_next/image?url=https%3A%2F%2Fprodcontent.yoki.com.br%2Fwp-content%2Fuploads%2F2024%2F09%2FFeijao-Troperio-6016x4016-1.jpg&w=1400&q=75'
                },
                {
                    nome: 'Cuscuz com Carne',
                    preco: '20,00',
                    img: 'https://www.estadao.com.br/resizer/v2/ZW5XVDRQNBH35BFJTAVACELG6E.jpg?quality=80&auth=0ecc62a2f1e5ece417cd460fffb0bc880f8802a7ae69c16df5e578c9f81440bd&width=1200&height=1200&smart=true'
                },
                {
                    nome: 'Pamonha',
                    preco: '8,00',
                    img: 'https://p2.trrsf.com/image/fget/cf/1200/900/middle/images.terra.com/2023/05/22/pamonha-r1ak8eh2lcfr.jpg'
                }
            ],
            'Bebidas': [
                {
                    nome: 'Quentão',
                    preco: '10,00',
                    img: 'https://www.sabornamesa.com.br/media/k2/items/cache/242a68bb1034576b0ba92e3912e97f74_XL.jpg'
                },
                {
                    nome: 'Vinho Quente',
                    preco: '12,00',
                    img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQG84js6UifZQb9PFiFstjobWJq3mTrXpNsnw&s'
                },
                {
                    nome: 'Suco de Caju',
                    preco: '8,00',
                    img: 'https://s2-receitas.glbimg.com/tOEYBMHRhCcCQa8yIz1zwysDe4A=/0x0:1024x770/984x0/smart/filters:strip_icc()/g.glbimg.com/og/gs/gsat5/f/thumbs/materia/2015/12/18/Suco_de_jabuticaba.jpg'
                },
                {
                    nome: 'Água de Coco',
                    preco: '7,00',
                    img: 'https://static.itdg.com.br/images/640-400/93534a5ec8c2e3443013bdfb1ae3357d/bebida-de-coco-para-festa-junina.jpg'
                }
            ],
            'Promoções': [
                {
                    nome: 'Combo Casal',
                    preco: '40,00',
                    img: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=800&q=75'
                },
                {
                    nome: 'Kit Família',
                    preco: '75,00',
                    img: 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800&q=75'
                },
                {
                    nome: 'Combo Bebidas (4 un)',
                    preco: '30,00',
                    img: 'https://cdn.pixabay.com/photo/2018/03/31/06/31/beverages-3279609_1280.jpg'
                },
                {
                    nome: 'Lanche + Bebida',
                    preco: '18,00',
                    img: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=800&q=75'
                }
            ],
            'Especial': [
                {
                    nome: 'Arroz Doce',
                    preco: '15,00',
                    img: 'https://www.temperando.com/wp-content/uploads/2019/02/ARROZ-DOCE-IMDEST-700x400.jpg'
                },
                {
                    nome: 'Canjica',
                    preco: '12,00',
                    img: 'https://www.estadao.com.br/resizer/v2/F6SPAHPFZRE3RAWE6YC3DUBUTQ.jpg?quality=80&auth=8272b34be35e0bfe68ccbf77d917f1f2aa34b61d917a651c737266d10303c5d9&width=720&height=410&smart=true'
                },
                {
                    nome: 'Bolo de Milho',
                    preco: '10,00',
                    img: 'https://static.itdg.com.br/images/1200-675/b06076b556e4dd56ad1c92389f51d894/bolo-de-milho-festa-junina.jpg'
                },
                {
                    nome: 'Pé de Moleque',
                    preco: '6,00',
                    img: 'https://anamariabrogui.com.br/assets/uploads/receitas/fotos/usuario-2741-10361d567e8a795aaf8c0d7364d976d0.jpg'
                }
            ]
        };

        function showScreen(id) {
            document.querySelectorAll('[id^="screen-"]').forEach(s => s.classList.add('hidden'));
            document.getElementById('screen-' + id).classList.remove('hidden');
        }

        function loadProducts(name, color) {
            showScreen('products');
            document.getElementById('category-title').innerText = name;
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            
            const list = fakeProducts[name] || fakeProducts['Comida'];
            list.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-[25px] overflow-hidden shadow-xl">
                        <img src="${p.img}" class="w-full h-40 object-cover" onerror="this.src='https://cdn.pixabay.com/photo/2017/06/06/22/46/mediterranean-cuisine-2378758_1280.jpg'">
                        <div class="p-4 flex justify-between items-center text-white" style="background-color: ${color}">
                            <span class="font-bold uppercase text-xs">${p.nome} — R$ ${p.preco}</span>
                            <button onclick="showScreen('checkout')" class="bg-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-lg" style="color: ${color}">+</button>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
