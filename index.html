<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festa Junina de Brasileirinhos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Barlow:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #eeb44f; font-family: 'Barlow', sans-serif; color: #4e342e; }
        .font-festiva { font-family: 'Fredoka+One', cursive; }

        /* CSS Corrigido para Inputs e Botões */
        .input-pill {
            width: 100%;
            background-color: #d9a441;
            border: none;
            border-radius: 9999px;
            padding: 0.8rem 1.5rem;
            color: white;
            outline: none;
        }
        .input-pill::placeholder { color: rgba(255, 255, 255, 0.7); }

        .btn-junino {
            width: 100%;
            padding: 1.2rem;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.2rem;
            text-transform: uppercase;
            color: white;
            border: none;
            border-bottom: 4px solid rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-junino:active { transform: scale(0.95); border-bottom-width: 2px; }
    </style>
</head>
<body>

    <div id="screen-home" class="max-w-md mx-auto p-6 flex flex-col items-center">
        <div class="w-full flex justify-around mb-10 text-2xl opacity-80">🚩 🏁 🚩 🏁</div>
        <h1 class="font-festiva text-white text-4xl text-center mb-1 drop-shadow-md">Festa Junina</h1>
        <p class="text-white text-[10px] font-black tracking-[0.3em] uppercase mb-12">de brasileirinhos</p>
        
        <div class="w-full space-y-4 px-2">
            <button onclick="loadProducts('Comida', '#3b82f6')" class="btn-junino" style="background-color: #3b82f6;">Comida</button>
            <button onclick="loadProducts('Bebidas', '#facc15')" class="btn-junino" style="background-color: #facc15;">Bebidas</button>
            <button onclick="loadProducts('Promoções', '#ef4444')" class="btn-junino" style="background-color: #ef4444;">Promoções</button>
            <button onclick="loadProducts('Especial', '#22c55e')" class="btn-junino" style="background-color: #22c55e;">Especial da Festa</button>
        </div>
    </div>

    <div id="screen-products" class="hidden max-w-md mx-auto p-4">
        <div class="flex items-center mb-8 pt-5 px-2">
            <button onclick="showScreen('home')" class="text-white text-3xl">↩</button>
            <h2 id="category-title" class="font-festiva text-white text-3xl text-center flex-1 pr-8">Produtos</h2>
        </div>
        <div id="products-grid" class="space-y-6 px-2">
            </div>
    </div>

    <div id="screen-checkout" class="hidden max-w-md mx-auto p-6">
        <button onclick="showScreen('home')" class="text-white text-3xl mb-8">↩</button>
        <h2 class="font-festiva text-white text-4xl text-center mb-10">PAGAMENTO</h2>
        <div class="space-y-5">
            <div>
                <label class="text-[10px] font-bold uppercase ml-4">Nome Completo</label>
                <input type="text" class="input-pill" placeholder="Robertinho Costa">
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase ml-4">CPF</label>
                <input type="text" class="input-pill" placeholder="000.000.000-00">
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase ml-4">Número do Cartão</label>
                <input type="text" class="input-pill" placeholder="0000 0000 0000 0000">
            </div>
            <div class="bg-[#d9a441] rounded-[20px] p-4 flex justify-between items-center text-white mt-10">
                <span class="font-bold text-xs uppercase">Forma de Pagamento</span>
                <span class="font-bold">PIX ▼</span>
            </div>
            <button onclick="showScreen('success')" class="w-full border-2 border-white text-white font-black py-4 rounded-full mt-10 uppercase tracking-widest">Fechar Pedido</button>
        </div>
    </div>

    <div id="screen-success" class="hidden max-w-md mx-auto p-6 text-center pt-24 text-white">
        <div class="w-full flex justify-around mb-10 text-2xl opacity-80">🚩 🏁 🚩 🏁</div>
        <h2 class="font-festiva text-4xl mb-6">Compra efetuada!</h2>
        <p class="text-lg mb-20 px-10">Muito obrigado pela sua preferência e compra!</p>
        <p class="font-festiva text-2xl mb-20 uppercase">Volte sempre</p>
        <button onclick="showScreen('home')" class="bg-white text-[#eeb44f] font-black px-12 py-4 rounded-full shadow-xl">NOVO PEDIDO</button>
    </div>

    <script>
        // Dados para teste (substituem o banco de dados vazio)
        const fakeProducts = {
            'Comida': [{nome: 'Baião de Dois', preco: '25,00', img: 'https://www.yoki.com.br/_next/image?url=https%3A%2F%2Fprodcontent.yoki.com.br%2Fwp-content%2Fuploads%2F2024%2F09%2FBaiao-de-dois-800x450-1.jpg&w=1400&q=75'}, 
            {nome: 'Feijão Tropeiro', preco: '22,00', img: 'https://www.yoki.com.br/_next/image?url=https%3A%2F%2Fprodcontent.yoki.com.br%2Fwp-content%2Fuploads%2F2024%2F09%2FFeijao-Troperio-6016x4016-1.jpg&w=1400&q=75'}],
            'Bebidas': [{nome: 'Quentão', preco: '10,00', img: 'https://cdn.pixabay.com/photo/2016/11/19/13/53/beverage-1839361_1280.jpg'}, 
            {nome: 'Vinho Quente', preco: '12,00', img: 'https://cdn.pixabay.com/photo/2015/11/07/11/48/mulled-wine-1031405_1280.jpg'}]
        };

        function showScreen(id) {
            document.querySelectorAll('[id^="screen-"]').forEach(s => s.classList.add('hidden'));
            document.getElementById('screen-' + id).classList.remove('hidden');
        }

        function loadProducts(name, color) {
            showScreen('products');
            document.getElementById('category-title').innerText = name;
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            
            const list = fakeProducts[name] || fakeProducts['Comida']; // Pega comida se não achar
            list.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-[25px] overflow-hidden shadow-xl">
                        <img src="${p.img}" class="w-full h-40 object-cover">
                        <div class="p-4 flex justify-between items-center text-white" style="background-color: ${color}">
                            <span class="font-bold uppercase text-xs">${p.nome} - R$ ${p.preco}</span>
                            <button onclick="showScreen('checkout')" class="bg-white rounded-full w-8 h-8 flex items-center justify-center font-bold" style="color: ${color}">+</button>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
