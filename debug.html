<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Debug — Festa Junina</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #eee;
            padding: 2rem;
        }

        h2 {
            color: #facc15;
        }

        .ok {
            color: #4ade80;
        }

        .err {
            color: #f87171;
        }

        pre {
            background: #111;
            padding: 1rem;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        button {
            background: #facc15;
            color: #000;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>
    <h2>🔍 Diagnóstico da API</h2>
    <button onclick="runTests()">▶ Rodar testes</button>
    <div id="output"></div>

    <script>
        async function runTests() {
            const out = document.getElementById('output');
            out.innerHTML = '<p>Rodando...</p>';
            let html = '';

            // Teste 1: /api/produtos sem categoria
            html += await test('GET /api/produtos', '/api/produtos');
            // Teste 2: /api/produtos com categoria
            html += await test('GET /api/produtos?categoria=Comida', '/api/produtos?categoria=Comida');

            out.innerHTML = html;
        }

        async function test(label, url) {
            let html = `<h3>${label}</h3>`;
            try {
                const res = await fetch(url);
                const text = await res.text();
                let pretty = text;
                try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch { }
                const cls = res.ok ? 'ok' : 'err';
                html += `<p class="${cls}">Status: ${res.status} ${res.statusText}</p>`;
                html += `<pre>${escHtml(pretty)}</pre>`;
            } catch (e) {
                html += `<p class="err">Erro de rede: ${escHtml(e.message)}</p>`;
            }
            return html;
        }

        function escHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>

</html>
